services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: stream_gps
      POSTGRES_USER: stream_gps
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stream_gps_local_only}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stream_gps -d stream_gps"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    command: node database/migrate.js
    restart: "no"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: stream_gps
      POSTGRES_USER: stream_gps
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stream_gps_local_only}
      MIGRATIONS_DIR: /app/migrations
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: stream_gps
      POSTGRES_USER: stream_gps
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stream_gps_local_only}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-do-not-use-in-production}
      PORT: 3000
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
      - caddy_local_data:/data
      - caddy_local_config:/config
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  caddy_local_data:
  caddy_local_config:
