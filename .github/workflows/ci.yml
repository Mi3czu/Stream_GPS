name: Device agent CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-agent:
    name: Validate device agent
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Check Python syntax
        run: python3 -m py_compile device-agent/stream_gps_agent.py

      - name: Check shell syntax
        run: |
          bash -n installer/install-device.sh
          bash -n device-agent/stream-gps-device
          bash -n device-agent/install-bluetooth-support.sh

      - name: Verify update checksums
        working-directory: device-agent
        run: sha256sum --check checksums.sha256
